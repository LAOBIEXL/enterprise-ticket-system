server:
  servlet:
    context-path: /dev-api
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/demo?characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # Redis 数据库索引，默认是 0
      database: 1
      # Redis 服务地址与端口
      host: 127.0.0.1
      port: 6379
      # 本地 Redis 未设置密码时保持为空
      password:
      # Redis 连接超时时间
      timeout: 10s

# Sa-Token 配置
sa-token:
  # Token 名称，同时也是 Cookie 名称
  token-name: satoken
  # Token 有效期，单位为秒；2592000 秒为 30 天，-1 表示永久有效
  timeout: 2592000
  # Token 最低活跃频率，-1 表示不限制、永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录
  is-concurrent: true
  # 多人登录同一账号时是否共用同一个 Token
  is-share: false
  # Token 生成风格
  token-style: uuid
  # 前后端分离模式：不从 Cookie 读取，也不向 Cookie 写入 Token
  is-read-cookie: false
  # 登录后同时把 Token 写入名为 satoken 的响应头
  is-write-header: true
  # 是否输出 Sa-Token 操作日志
  is-log: true
